name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-home
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore StreamlinkVlcStudio.sln --ignore-failed-sources

      - name: Build
        run: dotnet build StreamlinkVlcStudio.sln --configuration Release --no-restore

      - name: Publish app
        run: >
          dotnet publish
          src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:RequireBundledVlcOverlay=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts\publish\StreamlinkVlcStudio

      - name: Package release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\StreamlinkVlcStudio"
          $overlaySource = Join-Path $env:GITHUB_WORKSPACE "src\StreamlinkVlcStudio.Infrastructure\Vlc\BundledOverlay"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\package"

          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-release.ps1 `
            -PublishedAppDirectory $publishDir `
            -OverlaySource $overlaySource `
            -OutputRoot $outputRoot `
            -Quiet

          $zipPath = Join-Path $outputRoot "StreamlinkVlcStudio-release.zip"
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Release zip missing: $zipPath"
          }

      - name: Build setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseZip = Join-Path $env:GITHUB_WORKSPACE "artifacts\package\StreamlinkVlcStudio-release.zip"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"

          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-installer.ps1 `
            -ReleaseZip $releaseZip `
            -OutputRoot $outputRoot `
            -Quiet

          $setupPath = Join-Path $outputRoot "StreamlinkVlcStudio-Setup.exe"
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Setup installer missing: $setupPath"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamlinkVlcStudio-release
          path: |
            artifacts\StreamlinkVlcStudio-Setup.exe
            artifacts\package\StreamlinkVlcStudio-release.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release create $env:RELEASE_TAG `
            "artifacts\StreamlinkVlcStudio-Setup.exe" `
            "artifacts\package\StreamlinkVlcStudio-release.zip" `
            --target "${{ github.sha }}" `
            --title "Streamlink VLC Studio $env:RELEASE_TAG" `
            --notes "Automated Windows setup installer and release zip for commit ${{ github.sha }}." `
            --latest
