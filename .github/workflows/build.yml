name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate versioned Windows artifacts
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-home
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Resolve one build-wide version
        shell: pwsh
        run: |
          . .\scripts\lib\common.ps1
          . .\scripts\lib\release-contract.ps1
          $contract = Read-ReleaseContract .\shared\release-contract.json
          if ('${{ github.ref }}'.StartsWith('refs/tags/', [StringComparison]::Ordinal)) {
            $tag = '${{ github.ref_name }}'
            $identity = Get-StableReleaseIdentity `
              -Tag $tag `
              -MinimumVersion ([string]$contract.release.minimumVersion)
            $version = $identity.VersionText
            $stable = 'true'
          } else {
            $tag = ''
            [xml]$buildProperties = Get-Content .\Directory.Build.props -Raw
            $version = [string]$buildProperties.Project.PropertyGroup.VersionPrefix
            ConvertTo-StableReleaseVersion $version | Out-Null
            $stable = 'false'
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_STABLE_TAG=$stable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validation identity: version $version; stable tag: $stable."

      - name: Restore with vulnerability audit
        run: >
          dotnet restore StreamlinkVlcStudio.sln
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:NU1801,NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Restore pinned self-contained runtime graph
        run: >
          dotnet restore
          src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj
          --runtime win-x64
          --locked-mode
          -p:SelfContained=true
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:NU1801,NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Verify formatting and unused-code diagnostics
        run: dotnet format StreamlinkVlcStudio.sln --verify-no-changes --no-restore

      - name: Build with the resolved version and zero warnings
        shell: pwsh
        run: |
          dotnet build StreamlinkVlcStudio.sln `
            --configuration Release `
            --no-restore `
            -warnaserror `
            -p:Version=$env:RELEASE_VERSION `
            -p:VersionPrefix=$env:RELEASE_VERSION `
            -p:AssemblyVersion="$($env:RELEASE_VERSION).0" `
            -p:FileVersion="$($env:RELEASE_VERSION).0" `
            -p:InformationalVersion=$env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run headless-safe test suite
        env:
          SVS_SKIP_INTERACTIVE_WINDOW_TESTS: "true"
          # Includes replay controls, live hover, window sharing, hidden emotes, 28 Browse scroll tests, 2 native tab-switch tests, and native resize tracing.
          SVS_EXPECTED_MAX_SKIPS: "239"
          SVS_TEST_TIMEOUT_SECONDS: "30"
          SVS_TEST_DRAIN_TIMEOUT_SECONDS: "2"
        run: dotnet test tests\StreamlinkVlcStudio.Tests\StreamlinkVlcStudio.Tests.csproj --configuration Release --no-restore --no-build

      - name: Validate PowerShell and tooling contracts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $errors += "${($_.FullName)}: $($parseErrors | Out-String)" }
          }
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
          .\scripts\tests\tooling.tests.ps1
          .\scripts\verify-native-dependencies.ps1

      - name: Exercise RSA-PSS manifest signing and tamper rejection
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('update-signing-test-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $root 'shared') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'inputs') -Force | Out-Null
          $rsa = [Security.Cryptography.RSA]::Create(3072)
          try {
            $privatePath = Join-Path $root 'private.pem'
            $publicPath = Join-Path $root 'shared\update-signing-public-key.pem'
            [IO.File]::WriteAllText($privatePath, $rsa.ExportPkcs8PrivateKeyPem(), [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($publicPath, $rsa.ExportSubjectPublicKeyInfoPem(), [Text.UTF8Encoding]::new($false))
            $keyId = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($rsa.ExportSubjectPublicKeyInfo())).ToLowerInvariant()
          } finally {
            $rsa.Dispose()
          }
          $contract = Get-Content .\shared\release-contract.json -Raw | ConvertFrom-Json
          $contract.release.manifestSignature.keyId = $keyId
          $contractPath = Join-Path $root 'shared\release-contract.json'
          [IO.File]::WriteAllText($contractPath, ($contract | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          $setup = Join-Path $root 'inputs\StreamlinkVlcStudio-Setup.exe'
          $zip = Join-Path $root 'inputs\StreamlinkVlcStudio-release.zip'
          [IO.File]::WriteAllText($setup, 'test setup')
          [IO.File]::WriteAllText($zip, 'test zip')
          .\scripts\new-update-manifest.ps1 `
            -Version 1.7.0 `
            -Tag v1.7.0 `
            -Commit ('a' * 40) `
            -SetupPath $setup `
            -ZipPath $zip `
            -PrivateKeyPath $privatePath `
            -ContractPath $contractPath `
            -OutputDirectory $root | Out-Null
          $manifestPath = Join-Path $root 'UPDATE-MANIFEST.json'
          $signaturePath = Join-Path $root 'UPDATE-MANIFEST.sig'
          .\scripts\verify-update-manifest.ps1 `
            -ManifestPath $manifestPath `
            -SignaturePath $signaturePath `
            -ContractPath $contractPath `
            -SetupPath $setup `
            -ZipPath $zip
          [IO.File]::AppendAllText($manifestPath, ' ')
          try {
            .\scripts\verify-update-manifest.ps1 `
              -ManifestPath $manifestPath `
              -SignaturePath $signaturePath `
              -ContractPath $contractPath | Out-Null
            throw 'Tampered signed manifest was accepted.'
          } catch {
            if ($_.Exception.Message -eq 'Tampered signed manifest was accepted.') { throw }
          }
          Remove-Item -LiteralPath $root -Recurse -Force

      - name: Publish self-contained application with exact version resources
        shell: pwsh
        run: |
          dotnet publish `
            src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:RequireBundledVlcOverlay=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=$env:RELEASE_VERSION `
            -p:VersionPrefix=$env:RELEASE_VERSION `
            -p:AssemblyVersion="$($env:RELEASE_VERSION).0" `
            -p:FileVersion="$($env:RELEASE_VERSION).0" `
            -p:InformationalVersion=$env:RELEASE_VERSION `
            --output artifacts\publish\StreamStudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect pinned publish runtime
        shell: pwsh
        run: |
          $assets = Get-Content src\StreamlinkVlcStudio.App.Wpf\obj\project.assets.json -Raw
          foreach ($pack in @('Microsoft.NETCore.App.Runtime.win-x64', 'Microsoft.WindowsDesktop.App.Runtime.win-x64')) {
            $pattern = '"name":\s*"' + [regex]::Escape($pack) + '"[\s\S]{0,160}"version":\s*"\[10\.0\.10, 10\.0\.10\]"'
            if ($assets -notmatch $pattern) { throw "Publish assets do not contain pinned $pack 10.0.10." }
          }
          $exe = 'artifacts\publish\StreamStudio\StreamStudio.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf) -or (Get-Item $exe).Length -lt 1MB) {
            throw "Self-contained publish output is missing or unexpectedly small: $exe"
          }

      - name: Build unsigned validation ZIP and installers
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 `
            -PublishedAppDirectory artifacts\publish\StreamStudio `
            -OverlaySource src\StreamlinkVlcStudio.Infrastructure\Vlc\BundledOverlay `
            -OutputRoot artifacts\package `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -Commit '${{ github.sha }}' `
            -Repository '${{ github.repository }}' `
            -KeepStaging `
            -Quiet
          .\scripts\build-installer.ps1 `
            -ReleaseZip artifacts\package\StreamlinkVlcStudio-release.zip `
            -OutputRoot artifacts `
            -SetupFileName StreamStudio-App.msi `
            -BootstrapperFileName StreamlinkVlcStudio-Setup.exe `
            -ProductVersion $env:RELEASE_VERSION `
            -Quiet

      - name: Generate and verify versioned SPDX SBOM
        shell: pwsh
        run: |
          $parameters = @{
            RootDirectory = 'artifacts\package\StreamStudio'
            OutputPath = 'artifacts\package\StreamStudio.spdx.json'
            ProjectAssetsPath = 'src\StreamlinkVlcStudio.App.Wpf\obj\project.assets.json'
            PublishedDepsPath = 'src\StreamlinkVlcStudio.App.Wpf\bin\Release\net10.0-windows10.0.19041.0\win-x64\StreamStudio.deps.json'
            ApplicationVersion = $env:RELEASE_VERSION
            DocumentNamespace = 'https://github.com/${{ github.repository }}/sbom/validation/${{ github.sha }}'
          }
          .\scripts\generate-sbom.ps1 @parameters
          .\scripts\generate-sbom.ps1 @parameters -Verify

      - name: Assert exact validation-artifact version agreement
        shell: pwsh
        run: |
          .\scripts\assert-build-version.ps1 `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -Commit '${{ github.sha }}' `
            -Repository '${{ github.repository }}' `
            -SetupPath artifacts\StreamlinkVlcStudio-Setup.exe `
            -InternalMsiPath artifacts\StreamStudio-App.msi `
            -ZipPath artifacts\package\StreamlinkVlcStudio-release.zip `
            -SbomPath artifacts\package\StreamStudio.spdx.json

      - name: Stage validation-only artifact
        shell: pwsh
        run: |
          $root = 'artifacts\validation'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          foreach ($path in @(
              'artifacts\StreamlinkVlcStudio-Setup.exe',
              'artifacts\StreamStudio-App.msi',
              'artifacts\package\StreamlinkVlcStudio-release.zip',
              'artifacts\package\StreamStudio.spdx.json')) {
            Copy-Item -LiteralPath $path -Destination $root
          }
          $metadata = [ordered]@{
            schemaVersion = 1
            disposition = 'validation-only'
            version = $env:RELEASE_VERSION
            tag = if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) { $null } else { $env:RELEASE_TAG }
            commit = '${{ github.sha }}'
            repository = '${{ github.repository }}'
          }
          [IO.File]::WriteAllText(
            (Join-Path $root 'VALIDATION-METADATA.json'),
            ($metadata | ConvertTo-Json),
            [Text.UTF8Encoding]::new($false))

      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StreamStudio-validation-${{ github.sha }}
          path: artifacts\validation\*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish protected stable release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-home
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out exact stable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Validate stable tag and monotonic release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\lib\common.ps1
          . .\scripts\lib\release-contract.ps1
          $contract = Read-ReleaseContract .\shared\release-contract.json
          $identity = Get-StableReleaseIdentity `
            -Tag $env:RELEASE_TAG `
            -MinimumVersion ([string]$contract.release.minimumVersion)
          "RELEASE_VERSION=$($identity.VersionText)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:RELEASE_COMMIT) {
            throw "Stable tag does not resolve exactly to workflow commit $env:RELEASE_COMMIT."
          }
          $published = @(& gh api "repos/$env:RELEASE_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          foreach ($item in $published) {
            if ([bool]$item.draft -or [bool]$item.prerelease -or [string]$item.tag_name -notmatch '^v') { continue }
            try { $other = Get-StableReleaseIdentity -Tag ([string]$item.tag_name) -MinimumVersion '0.0.0' } catch { continue }
            if ($other.Version -ge $identity.Version) {
              throw "A final release at or above $env:RELEASE_TAG already exists: $($item.tag_name)."
            }
          }

      - name: Restore release runtime graph
        shell: pwsh
        run: |
          dotnet restore StreamlinkVlcStudio.sln `
            --locked-mode `
            -p:NuGetAudit=true `
            -p:NuGetAuditMode=all `
            -warnaserror:NU1801,NU1900,NU1901,NU1902,NU1903,NU1904
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore `
            src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj `
            --runtime win-x64 `
            --locked-mode `
            -p:SelfContained=true `
            -p:NuGetAudit=true `
            -p:NuGetAuditMode=all `
            -warnaserror:NU1801,NU1900,NU1901,NU1902,NU1903,NU1904
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure optional all-or-nothing Authenticode signing
        shell: pwsh
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
          AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          $configured = @(
            -not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_BASE64),
            -not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_PASSWORD),
            -not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_TIMESTAMP_URL))
          $count = @($configured | Where-Object { $_ }).Count
          if ($count -notin @(0, 3)) {
            throw 'Authenticode release secrets are partially configured; configure PFX, password, and RFC3161 timestamp URL together.'
          }
          if ($count -eq 0) {
            Write-Host 'Authenticode is not configured; this release will retain the documented unknown-publisher warning.'
            return
          }
          $timestamp = $null
          if (-not [Uri]::TryCreate($env:AUTHENTICODE_TIMESTAMP_URL, [UriKind]::Absolute, [ref]$timestamp) -or $timestamp.Scheme -ne 'https') {
            throw 'AUTHENTICODE_TIMESTAMP_URL must be absolute HTTPS.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'stream-studio-release.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:AUTHENTICODE_PFX_BASE64))
            $password = ConvertTo-SecureString $env:AUTHENTICODE_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) { throw 'The Authenticode PFX did not import with a private key.' }
            "SVS_AUTHENTICODE_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "SVS_AUTHENTICODE_TIMESTAMP_URL=$($timestamp.AbsoluteUri)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Publish exact-version release application
        shell: pwsh
        run: |
          dotnet publish `
            src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:RequireBundledVlcOverlay=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=$env:RELEASE_VERSION `
            -p:VersionPrefix=$env:RELEASE_VERSION `
            -p:AssemblyVersion="$($env:RELEASE_VERSION).0" `
            -p:FileVersion="$($env:RELEASE_VERSION).0" `
            -p:InformationalVersion=$env:RELEASE_VERSION `
            --output artifacts\publish\StreamStudio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build final ZIP, internal MSI, and Setup bundle
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 `
            -PublishedAppDirectory artifacts\publish\StreamStudio `
            -OverlaySource src\StreamlinkVlcStudio.Infrastructure\Vlc\BundledOverlay `
            -OutputRoot artifacts\package `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -Commit $env:RELEASE_COMMIT `
            -Repository $env:RELEASE_REPOSITORY `
            -KeepStaging `
            -Quiet
          .\scripts\build-installer.ps1 `
            -ReleaseZip artifacts\package\StreamlinkVlcStudio-release.zip `
            -OutputRoot artifacts `
            -SetupFileName StreamStudio-App.msi `
            -BootstrapperFileName StreamlinkVlcStudio-Setup.exe `
            -ProductVersion $env:RELEASE_VERSION `
            -Quiet

      - name: Generate and verify final versioned SPDX SBOM
        shell: pwsh
        run: |
          $parameters = @{
            RootDirectory = 'artifacts\package\StreamStudio'
            OutputPath = 'artifacts\package\StreamStudio.spdx.json'
            ProjectAssetsPath = 'src\StreamlinkVlcStudio.App.Wpf\obj\project.assets.json'
            PublishedDepsPath = 'src\StreamlinkVlcStudio.App.Wpf\bin\Release\net10.0-windows10.0.19041.0\win-x64\StreamStudio.deps.json'
            ApplicationVersion = $env:RELEASE_VERSION
            DocumentNamespace = "https://github.com/$env:RELEASE_REPOSITORY/sbom/$env:RELEASE_TAG/$env:RELEASE_COMMIT"
          }
          .\scripts\generate-sbom.ps1 @parameters
          .\scripts\generate-sbom.ps1 @parameters -Verify

      - name: Sign exact UTF-8 update manifest with protected release key
        shell: pwsh
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PRIVATE_KEY_PEM)) {
            throw 'Protected release secret UPDATE_MANIFEST_PRIVATE_KEY_PEM is required.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'stream-studio-update-private.pem'
          "UPDATE_PRIVATE_KEY_PATH=$keyPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [IO.File]::WriteAllText($keyPath, $env:UPDATE_MANIFEST_PRIVATE_KEY_PEM, [Text.UTF8Encoding]::new($false))
          .\scripts\new-update-manifest.ps1 `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -Commit $env:RELEASE_COMMIT `
            -Repository $env:RELEASE_REPOSITORY `
            -SetupPath artifacts\StreamlinkVlcStudio-Setup.exe `
            -ZipPath artifacts\package\StreamlinkVlcStudio-release.zip `
            -PrivateKeyPath $keyPath `
            -OutputDirectory artifacts

      - name: Generate provenance metadata and assert exact agreement
        shell: pwsh
        run: |
          .\scripts\new-release-metadata.ps1 `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -Commit $env:RELEASE_COMMIT `
            -Repository $env:RELEASE_REPOSITORY `
            -SourceRef '${{ github.ref }}' `
            -WorkflowRef '${{ github.workflow_ref }}' `
            -WorkflowRunId ${{ github.run_id }} `
            -WorkflowRunNumber ${{ github.run_number }} `
            -WorkflowRunAttempt ${{ github.run_attempt }} `
            -SetupPath artifacts\StreamlinkVlcStudio-Setup.exe `
            -InternalMsiPath artifacts\StreamStudio-App.msi `
            -ZipPath artifacts\package\StreamlinkVlcStudio-release.zip `
            -SbomPath artifacts\package\StreamStudio.spdx.json `
            -UpdateManifestPath artifacts\UPDATE-MANIFEST.json `
            -UpdateSignaturePath artifacts\UPDATE-MANIFEST.sig `
            -OutputPath artifacts\RELEASE-METADATA.json
          .\scripts\assert-release-artifacts.ps1 `
            -Version $env:RELEASE_VERSION `
            -Tag $env:RELEASE_TAG `
            -Commit $env:RELEASE_COMMIT `
            -Repository $env:RELEASE_REPOSITORY `
            -SetupPath artifacts\StreamlinkVlcStudio-Setup.exe `
            -InternalMsiPath artifacts\StreamStudio-App.msi `
            -ZipPath artifacts\package\StreamlinkVlcStudio-release.zip `
            -SbomPath artifacts\package\StreamStudio.spdx.json `
            -MetadataPath artifacts\RELEASE-METADATA.json `
            -UpdateManifestPath artifacts\UPDATE-MANIFEST.json `
            -UpdateSignaturePath artifacts\UPDATE-MANIFEST.sig

      - name: Atomically stage and independently revalidate closed public release set
        shell: pwsh
        run: |
          .\scripts\stage-release-set.ps1 -Quiet
          .\scripts\stage-release-set.ps1 -Check -CheckRoot artifacts\release-set -Quiet
          if (Test-Path -LiteralPath artifacts\release-set\StreamStudio-App.msi) {
            throw 'Internal MSI must never enter the public release set.'
          }

      - name: Upload reviewed stable release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StreamlinkVlcStudio-release-${{ github.ref_name }}
          path: artifacts\release-set\*
          if-no-files-found: error
          retention-days: 30

      - name: Attest reviewed release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: artifacts\release-set\SHA256SUMS.txt

      - name: Attest release payload SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts\release-set\StreamlinkVlcStudio-release.zip
          sbom-path: artifacts\release-set\StreamStudio.spdx.json

      - name: Publish exact stable-tag GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub release $env:RELEASE_TAG already exists." }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = @"
          ## Stream Studio $env:RELEASE_TAG

          **One-time migration for 1.6.65 and earlier:** those clients cannot discover this signed update channel. Download and run `StreamlinkVlcStudio-Setup.exe` manually once. Future managed releases can then be downloaded and installed from inside the app.

          `StreamlinkVlcStudio-Setup.exe` is the supported per-machine installer and updater. The ZIP/PowerShell package is an advanced per-user fallback and receives verified release notifications only.

          Initial releases may be Authenticode-unsigned and show an “unknown publisher” warning. In every release, `UPDATE-MANIFEST.json` is integrity-protected by the detached RSA-PSS/SHA-256 signature, and `SHA256SUMS.txt` covers the complete public release set.
          "@
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $versionNotes = Join-Path 'docs/releases' "$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $versionNotes) { $notesPath = $versionNotes }
          $assets = @(Get-ChildItem artifacts\release-set -File | Sort-Object Name | ForEach-Object { $_.FullName })
          & gh release create $env:RELEASE_TAG @assets `
            --repo $env:RELEASE_REPOSITORY `
            --verify-tag `
            --title "Stream Studio $env:RELEASE_TAG" `
            --notes-file $notesPath `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed with exit code $LASTEXITCODE." }

      - name: Remove protected signing material
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_PATH) -and (Test-Path -LiteralPath $env:UPDATE_PRIVATE_KEY_PATH)) {
            Remove-Item -LiteralPath $env:UPDATE_PRIVATE_KEY_PATH -Force
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SVS_AUTHENTICODE_CERTIFICATE_THUMBPRINT)) {
            $certificatePath = "Cert:\CurrentUser\My\$($env:SVS_AUTHENTICODE_CERTIFICATE_THUMBPRINT)"
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }
