name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build, test, and package
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read

    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-home
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Restore with vulnerability audit
        run: >
          dotnet restore StreamlinkVlcStudio.sln
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:NU1801,NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Restore pinned self-contained runtime graph
        run: >
          dotnet restore
          src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj
          --runtime win-x64
          --locked-mode
          -p:SelfContained=true
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:NU1801,NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Verify formatting and unused-code diagnostics
        run: dotnet format StreamlinkVlcStudio.sln --verify-no-changes --no-restore

      - name: Build with zero warnings
        run: dotnet build StreamlinkVlcStudio.sln --configuration Release --no-restore -warnaserror

      - name: Run headless-safe test suite
        env:
          SVS_SKIP_INTERACTIVE_WINDOW_TESTS: "true"
          SVS_EXPECTED_MAX_SKIPS: "146"
          SVS_TEST_TIMEOUT_SECONDS: "30"
          SVS_TEST_DRAIN_TIMEOUT_SECONDS: "2"
        run: dotnet test tests\StreamlinkVlcStudio.Tests\StreamlinkVlcStudio.Tests.csproj --configuration Release --no-restore --no-build

      - name: Test browser extension
        run: |
          node --check browser-extension\background.js
          node --check browser-extension\platform-routes.generated.js
          node --check browser-extension\content-core.js
          node --check browser-extension\content.js
          node --test browser-extension\tests\content-core.test.js

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += "${($_.FullName)}: $($parseErrors | Out-String)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | Write-Error
            exit 1
          }

      - name: Verify generated browser routes and tooling contracts
        shell: pwsh
        run: |
          .\scripts\generate-browser-route-policy.ps1 -Check
          .\scripts\tests\tooling.tests.ps1

      - name: Verify pinned native inputs
        shell: pwsh
        run: .\scripts\verify-native-dependencies.ps1

      - name: Publish self-contained app
        run: >
          dotnet publish
          src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:RequireBundledVlcOverlay=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts\publish\StreamlinkVlcStudio

      - name: Inspect pinned publish runtime
        shell: pwsh
        run: |
          $assets = Get-Content src\StreamlinkVlcStudio.App.Wpf\obj\project.assets.json -Raw
          foreach ($pack in @('Microsoft.NETCore.App.Runtime.win-x64', 'Microsoft.WindowsDesktop.App.Runtime.win-x64')) {
            $pattern = '"name":\s*"' + [regex]::Escape($pack) + '"[\s\S]{0,160}"version":\s*"\[10\.0\.10, 10\.0\.10\]"'
            if ($assets -notmatch $pattern) {
              throw "Publish assets do not contain the pinned $pack 10.0.10 runtime."
            }
          }
          $exe = 'artifacts\publish\StreamlinkVlcStudio\StreamlinkVlcStudio.App.Wpf.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf) -or (Get-Item $exe).Length -lt 1MB) {
            throw "Self-contained publish output is missing or unexpectedly small: $exe"
          }

      - name: Package release zip
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 `
            -PublishedAppDirectory artifacts\publish\StreamlinkVlcStudio `
            -OverlaySource src\StreamlinkVlcStudio.Infrastructure\Vlc\BundledOverlay `
            -OutputRoot artifacts\package `
            -KeepStaging `
            -Quiet

      - name: Generate and verify SPDX SBOM
        shell: pwsh
        run: |
          $parameters = @{
            RootDirectory = 'artifacts\package\StreamlinkVlcStudio'
            OutputPath = 'artifacts\package\StreamlinkVlcStudio.spdx.json'
            ProjectAssetsPath = 'src\StreamlinkVlcStudio.App.Wpf\obj\project.assets.json'
            PublishedDepsPath = 'src\StreamlinkVlcStudio.App.Wpf\bin\Release\net10.0-windows10.0.19041.0\win-x64\StreamlinkVlcStudio.App.Wpf.deps.json'
            DocumentNamespace = 'https://github.com/${{ github.repository }}/sbom/${{ github.sha }}'
          }
          .\scripts\generate-sbom.ps1 @parameters
          .\scripts\generate-sbom.ps1 @parameters -Verify

      - name: Build full and app-only installers
        shell: pwsh
        run: |
          . .\scripts\lib\release-contract.ps1
          $runNumber = [int64]::Parse('${{ github.run_number }}')
          $runAttempt = [int64]::Parse('${{ github.run_attempt }}')
          $version = Get-MsiProductVersion -RunNumber $runNumber -RunAttempt $runAttempt
          Write-Host "MSI ProductVersion: $($version.ProductVersion) (ordinal $($version.Ordinal))"

          .\scripts\build-installer.ps1 `
            -ReleaseZip artifacts\package\StreamlinkVlcStudio-release.zip `
            -OutputRoot artifacts `
            -SetupFileName StreamlinkVlcStudio-Setup.msi `
            -ProductVersion $version.ProductVersion `
            -Quiet

      - name: Create release provenance metadata
        shell: pwsh
        run: |
          . .\scripts\lib\release-contract.ps1
          $runNumber = [int64]::Parse('${{ github.run_number }}')
          $runAttempt = [int64]::Parse('${{ github.run_attempt }}')
          $version = Get-MsiProductVersion -RunNumber $runNumber -RunAttempt $runAttempt
          $metadata = [ordered]@{
            schemaVersion = 1
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            sourceRef = '${{ github.ref }}'
            workflowRef = '${{ github.workflow_ref }}'
            workflowRunId = [int64]::Parse('${{ github.run_id }}')
            workflowRunNumber = $runNumber
            workflowRunAttempt = $runAttempt
            buildOrdinal = $version.Ordinal
            msiProductVersion = $version.ProductVersion
            dotnetSdkVersion = '10.0.302'
            selfContainedRuntimeVersion = '10.0.10'
            nativeInputManifestSha256 = (Get-FileHash dependencies\native-overlay.json -Algorithm SHA256).Hash.ToLowerInvariant()
            createdUtc = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          [IO.File]::WriteAllText(
            (Join-Path (Resolve-Path artifacts) 'RELEASE-METADATA.json'),
            ($metadata | ConvertTo-Json -Depth 4),
            [Text.UTF8Encoding]::new($false))

      - name: Atomically promote verified closed release set
        shell: pwsh
        run: .\scripts\stage-release-set.ps1 -Quiet

      - name: Upload reviewed release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StreamlinkVlcStudio-release-${{ github.sha }}
          path: artifacts\release-set\*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish trusted-main release
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated artifacts only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: StreamlinkVlcStudio-release-${{ github.sha }}
          path: artifacts

      - name: Revalidate release checksums
        shell: pwsh
        run: |
          .\scripts\stage-release-set.ps1 -Check -CheckRoot artifacts -Quiet
          $metadataFile = Get-Item -LiteralPath artifacts\RELEASE-METADATA.json
          $metadata = Get-Content -LiteralPath $metadataFile.FullName -Raw | ConvertFrom-Json
          if ($metadata.schemaVersion -ne 1 -or
              $metadata.repository -cne '${{ github.repository }}' -or
              $metadata.commit -cne '${{ github.sha }}' -or
              [int64]$metadata.workflowRunId -ne [int64]::Parse('${{ github.run_id }}') -or
              [int64]$metadata.workflowRunAttempt -ne [int64]::Parse('${{ github.run_attempt }}')) {
            throw 'Release provenance metadata does not match this workflow run.'
          }

      - name: Reject a stale release version before attestation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $metadata = Get-ChildItem artifacts -File -Recurse -Filter RELEASE-METADATA.json | Get-Content -Raw | ConvertFrom-Json
          $ordinal = [int64]$metadata.buildOrdinal
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releases = @(Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:RELEASE_REPOSITORY/releases?per_page=100" `
            -Headers $headers)
          $conflicts = @(
            $releases | Where-Object {
              $_.tag_name -match '^release-(?<ordinal>\d+)-run-' -and
              [int64]$Matches.ordinal -ge $ordinal
            }
          )
          if ($conflicts.Count -gt 0) {
            throw "Refusing to attest or publish non-increasing release ordinal $ordinal."
          }

      - name: Attest reviewed release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: artifacts\SHA256SUMS.txt

      - name: Attest release payload SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts\StreamlinkVlcStudio-release.zip
          sbom-path: artifacts\StreamlinkVlcStudio.spdx.json

      - name: Publish GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          . .\scripts\lib\common.ps1
          . .\scripts\lib\release-contract.ps1
          $contract = Read-ReleaseContract .\shared\release-contract.json
          $releaseSet = @(Test-VerifiedReleaseSet -Contract $contract -Root artifacts)
          $metadata = Get-ChildItem artifacts -File -Recurse -Filter RELEASE-METADATA.json | Get-Content -Raw | ConvertFrom-Json
          $ordinal = [int64]$metadata.buildOrdinal
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:RELEASE_REPOSITORY"
          $releaseList = @(Invoke-RestMethod -Uri "$apiRoot/releases?per_page=100" -Headers $headers)
          $publishedOrdinals = @(
            $releaseList | ForEach-Object {
              if ($_.tag_name -match '^release-(?<ordinal>\d+)-run-') {
                [int64]$Matches.ordinal
              }
            }
          )
          if (@($publishedOrdinals | Where-Object { $_ -ge $ordinal }).Count -gt 0) {
            throw "Refusing to publish non-increasing release ordinal $ordinal."
          }

          $releaseTag = "release-$ordinal-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          $assets = @($releaseSet | ForEach-Object { $_.File.FullName })

          $createBody = @{
            tag_name = $releaseTag
            target_commitish = '${{ github.sha }}'
            name = "Streamlink VLC Studio $releaseTag"
            body = 'Validated Windows installers, release zip, provenance metadata, SHA-256 manifest, SPDX SBOM, and GitHub artifact attestations for commit ${{ github.sha }} (run ${{ github.run_id }}, attempt ${{ github.run_attempt }}).'
            draft = $true
            prerelease = $false
            make_latest = 'false'
          } | ConvertTo-Json
          $release = Invoke-RestMethod `
            -Method Post `
            -Uri "$apiRoot/releases" `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $createBody
          $uploadRoot = [regex]::Replace([string]$release.upload_url, '\{\?name,label\}$', '')
          foreach ($asset in $assets) {
            $assetName = [Uri]::EscapeDataString((Split-Path -Leaf $asset))
            Invoke-WebRequest `
              -Method Post `
              -Uri ("{0}?name={1}" -f $uploadRoot, $assetName) `
              -Headers $headers `
              -ContentType 'application/octet-stream' `
              -InFile $asset | Out-Null
          }
          $publishBody = @{ draft = $false; make_latest = 'true' } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Patch `
            -Uri "$apiRoot/releases/$($release.id)" `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $publishBody | Out-Null
