name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Minimum privileges by default; the release step re-elevates.
permissions:
  contents: read

# Cancel outdated in-progress runs on the same branch/PR to save CI minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      contents: write   # required for the "Publish GitHub release" step on main

    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-home
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore StreamlinkVlcStudio.sln --ignore-failed-sources

      - name: Build
        run: dotnet build StreamlinkVlcStudio.sln --configuration Release --no-restore

      - name: Test
        env:
          # Hosted Windows runners do not provide a reliable interactive foreground desktop;
          # the test harness skips its STA/WPF desktop tests in this headless CI mode.
          SVS_SKIP_INTERACTIVE_WINDOW_TESTS: "true"
        run: dotnet test tests\StreamlinkVlcStudio.Tests\StreamlinkVlcStudio.Tests.csproj --configuration Release --no-restore

      - name: Test browser extension
        run: node --test browser-extension\tests\content-core.test.js

      - name: Publish app
        run: >
          dotnet publish
          src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:PublishTrimmed=false
          -p:RequireBundledVlcOverlay=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts\publish\StreamlinkVlcStudio

      - name: Package release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\StreamlinkVlcStudio"
          $overlaySource = Join-Path $env:GITHUB_WORKSPACE "src\StreamlinkVlcStudio.Infrastructure\Vlc\BundledOverlay"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\package"

          & "$env:GITHUB_WORKSPACE\scripts\package-release.ps1" `
            -PublishedAppDirectory $publishDir `
            -OverlaySource $overlaySource `
            -OutputRoot $outputRoot `
            -Quiet

          $zipPath = Join-Path $outputRoot "StreamlinkVlcStudio-release.zip"
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Release zip missing: $zipPath"
          }

      - name: Build full and app-only installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseZip = Join-Path $env:GITHUB_WORKSPACE "artifacts\package\StreamlinkVlcStudio-release.zip"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $buildNumber = [int64]::Parse('${{ github.run_number }}')
          $productVersion = "{0}.{1}.{2}" -f `
            (1 + [int64][math]::Floor($buildNumber / 65536)), `
            ([int64][math]::Floor(($buildNumber % 65536) / 256)), `
            ($buildNumber % 256)

          Write-Host "MSI ProductVersion: $productVersion"

          & "$env:GITHUB_WORKSPACE\scripts\build-installer.ps1" `
            -ReleaseZip $releaseZip `
            -OutputRoot $outputRoot `
            -SetupFileName "StreamlinkVlcStudio-Setup.msi" `
            -ProductVersion $productVersion `
            -Quiet

          $setupPath = Join-Path $outputRoot "StreamlinkVlcStudio-Setup.msi"
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "MSI installer missing: $setupPath"
          }
          $bootstrapperPath = Join-Path $outputRoot "StreamlinkVlcStudio-Setup.exe"
          if (-not (Test-Path -LiteralPath $bootstrapperPath -PathType Leaf)) {
            throw "Full dependency installer missing: $bootstrapperPath"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamlinkVlcStudio-release
          path: |
            artifacts\StreamlinkVlcStudio-Setup.exe
            artifacts\StreamlinkVlcStudio-Setup.msi
            artifacts\package\StreamlinkVlcStudio-release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release create $env:RELEASE_TAG `
            "artifacts\StreamlinkVlcStudio-Setup.exe" `
            "artifacts\StreamlinkVlcStudio-Setup.msi" `
            "artifacts\package\StreamlinkVlcStudio-release.zip" `
            --target "${{ github.sha }}" `
            --title "Streamlink VLC Studio $env:RELEASE_TAG" `
            --notes "Automated Windows full dependency installer, app-only MSI, and release zip for commit ${{ github.sha }} from workflow run ${{ github.run_id }} attempt ${{ github.run_attempt }}." `
            --latest
