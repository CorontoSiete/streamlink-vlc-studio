name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-home
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore StreamlinkVlcStudio.sln --ignore-failed-sources

      - name: Build
        run: dotnet build StreamlinkVlcStudio.sln --configuration Release --no-restore

      - name: Publish app
        run: >
          dotnet publish
          src\StreamlinkVlcStudio.App.Wpf\StreamlinkVlcStudio.App.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts\publish\StreamlinkVlcStudio

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\StreamlinkVlcStudio"
          $publishedExe = Join-Path $publishDir "StreamlinkVlcStudio.App.Wpf.exe"
          $releaseExe = Join-Path $env:GITHUB_WORKSPACE "artifacts\StreamlinkVlcStudio.exe"

          if (-not (Test-Path -LiteralPath $publishedExe -PathType Leaf)) {
            throw "Published executable missing: $publishedExe"
          }

          New-Item -ItemType Directory -Path (Split-Path -Parent $releaseExe) -Force | Out-Null
          Copy-Item -LiteralPath $publishedExe -Destination $releaseExe -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamlinkVlcStudio-exe
          path: artifacts\StreamlinkVlcStudio.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release create $env:RELEASE_TAG `
            "artifacts\StreamlinkVlcStudio.exe" `
            --target "${{ github.sha }}" `
            --title "Streamlink VLC Studio $env:RELEASE_TAG" `
            --notes "Automated self-contained Windows executable for commit ${{ github.sha }}." `
            --latest
