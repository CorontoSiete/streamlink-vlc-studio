name: Published updater upgrade smoke test

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Published version to upgrade from
        required: true
        default: v1.7.0
      target_tag:
        description: Published version to install
        required: true
        default: v1.7.5
      helper_source:
        description: Use target for clients predating the packaged-updater fix
        required: true
        type: choice
        options:
          - source
          - target
        default: target

permissions:
  contents: read

jobs:
  upgrade:
    name: Install, update, and restart on disposable Windows
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned SDK for the packaged probe
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build packaged updater probe
        shell: pwsh
        run: dotnet build tests/StreamlinkVlcStudio.UpdateProbe/StreamlinkVlcStudio.UpdateProbe.csproj --configuration Release -warnaserror

      - name: Exercise installation, update helper, and restart
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          HELPER_SOURCE: ${{ inputs.helper_source }}
        run: ./scripts/test-published-upgrade.ps1 -SourceTag $env:SOURCE_TAG -TargetTag $env:TARGET_TAG -HelperSource $env:HELPER_SOURCE

      - name: Retain installation and updater logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-upgrade-logs-${{ github.run_id }}
          path: artifacts/upgrade-smoke
          if-no-files-found: warn
          retention-days: 14
