name: Account service checks

on:
  push:
    paths:
      - hosting/cloudflare/**
      - shared/oauth-clients.json
      - .github/workflows/account-service.yml
  pull_request:
    paths:
      - hosting/cloudflare/**
      - shared/oauth-clients.json
      - .github/workflows/account-service.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hosting/cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hosting/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
